name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build and verify
        run: ./scripts/test.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DarkNotch-dmg
          path: dist/DarkNotch-*.dmg
          if-no-files-found: error
