name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build and verify
        run: ./scripts/test.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: DarkNotch-dmg
          path: dist/DarkNotch-*.dmg
          if-no-files-found: error
