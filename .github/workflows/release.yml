name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.0.1). Defaults to the VERSION file."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish DMG and update feed
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION#v}"
            tag="v$version"
          else
            version="$(tr -d '[:space:]' < VERSION)"
            tag="v$version"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build, sign and verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/test.sh

      - name: Build Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: ./scripts/make-appcast.sh

      - name: Write checksums
        working-directory: dist
        run: |
          shasum -a 256 \
            "DarkNotch-${{ steps.version.outputs.version }}.dmg" \
            "DarkNotch-${{ steps.version.outputs.version }}.zip" \
            appcast.xml > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DarkNotch-${{ steps.version.outputs.version }}
          path: |
            dist/DarkNotch-${{ steps.version.outputs.version }}.dmg
            dist/DarkNotch-${{ steps.version.outputs.version }}.zip
            dist/appcast.xml
            dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          dmg="dist/DarkNotch-$VERSION.dmg"
          zip="dist/DarkNotch-$VERSION.zip"
          cat > release-notes.md <<EOF
          ## DarkNotch $VERSION

          Сборка для **macOS 27 Golden Gate**. Перетащите **DarkNotch** в **Applications**.

          Внутри DMG — оформленная инструкция Install.html с разблокировкой
          первого запуска и разрешением Accessibility. Приложение не подписано
          сертификатом Apple: откройте **Системные настройки → Конфиденциальность
          и безопасность → Безопасность → Открыть всё равно**.

          Обновления приходят автоматически через Sparkle: **Проверить обновления…**
          в меню приложения. Для обновления не нужен повторный DMG.

          SHA-256: $(cut -d' ' -f1 dist/SHA256SUMS)

          ---

          Built for **macOS 27 Golden Gate**. Drag **DarkNotch** into **Applications**.

          The DMG includes a styled Install.html guide for the first-launch
          Gatekeeper prompt and Accessibility. The app is unsigned, so use
          **System Settings → Privacy & Security → Open Anyway**.

          Updates are delivered by Sparkle via **Check for Updates…** in the app menu.
          SHA-256: $(cut -d' ' -f1 dist/SHA256SUMS)
          EOF

          assets=("$dmg" "$zip" dist/appcast.xml dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "DarkNotch $VERSION" --notes-file release-notes.md
          elif [[ "$IS_TAG" == "true" ]]; then
            gh release create "$TAG" "${assets[@]}" \
              --title "DarkNotch $VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "DarkNotch $VERSION" --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
